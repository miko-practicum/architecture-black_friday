<text x="60" y="64" font-size="32" fill="#152B40" font-weight="bold" text-anchor="start">01  /  Шардирование</text>
<text x="60" y="105" font-size="18" fill="#526476" font-weight="normal" text-anchor="start">Два шарда распределяют данные; приложение обращается к кластеру через mongos.</text>
