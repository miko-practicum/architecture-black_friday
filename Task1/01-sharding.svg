<rect x="80" y="535" width="230" height="100" rx="16" fill="#EAF3FC" stroke="#245D91" stroke-width="2"/>
<text x="195.0" y="567" font-size="20" fill="#24374A" font-weight="bold" text-anchor="middle">pymongo-api</text>
<text x="195.0" y="590" font-size="16" fill="#425466" font-weight="normal" text-anchor="middle">FastAPI / Motor</text>
<text x="195.0" y="612" font-size="13" fill="#245D91" font-weight="bold" text-anchor="middle">:8080</text>
