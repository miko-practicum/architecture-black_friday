<text x="1030.0" y="625" font-size="16" fill="#425466" font-weight="normal" text-anchor="middle">mongod --shardsvr</text>
<text x="1030.0" y="643" font-size="13" fill="#378566" font-weight="bold" text-anchor="middle">PRIMARY</text>
<path d="M930,880 A100.0,15 0 0 1 1130,880 V950 A100.0,15 0 0 1 930,950 Z" fill="#FFFFFF" stroke="#387D9D" stroke-width="2"/>
