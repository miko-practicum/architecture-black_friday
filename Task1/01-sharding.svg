<text x="1030.0" y="315" font-size="16" fill="#425466" font-weight="normal" text-anchor="middle">mongod --configsvr</text>
<text x="1030.0" y="333" font-size="13" fill="#B87518" font-weight="bold" text-anchor="middle">PRIMARY</text>
<path d="M930,570 A100.0,15 0 0 1 1130,570 V640 A100.0,15 0 0 1 930,640 Z" fill="#FFFFFF" stroke="#378566" stroke-width="2"/>
