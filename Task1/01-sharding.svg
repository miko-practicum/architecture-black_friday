<text x="1030.0" y="935" font-size="16" fill="#425466" font-weight="normal" text-anchor="middle">mongod --shardsvr</text>
<text x="1030.0" y="953" font-size="13" fill="#387D9D" font-weight="bold" text-anchor="middle">PRIMARY</text>
<rect x="780.0" y="267" width="70" height="18" fill="white"/>
<text x="815" y="280" font-size="13" fill="#B87518" font-weight="normal" text-anchor="middle">метаданные</text>
<rect x="790.5" y="577" width="105" height="18" fill="white"/>
<text x="843" y="590" font-size="13" fill="#245D91" font-weight="normal" text-anchor="middle">чтение / запись</text>
<rect x="790.5" y="887" width="105" height="18" fill="white"/>
<text x="843" y="900" font-size="13" fill="#245D91" font-weight="normal" text-anchor="middle">чтение / запись</text>
<rect x="379.0" y="553" width="112" height="18" fill="white"/>
<text x="435" y="566" font-size="13" fill="#245D91" font-weight="normal" text-anchor="middle">MongoDB protocol</text>
<text x="1210" y="272.0" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">Один участник replica set.</text>
<text x="1210" y="295.8" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">Учебный этап: резервных копий</text>
<text x="1210" y="319.6" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">на других узлах пока нет.</text>
<text x="1210" y="582.0" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">Один участник replica set.</text>
<text x="1210" y="605.8" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">Учебный этап: резервных копий</text>
<text x="1210" y="629.6" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">на других узлах пока нет.</text>
<text x="1210" y="892.0" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">Один участник replica set.</text>
<text x="1210" y="915.8" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">Учебный этап: резервных копий</text>
<text x="1210" y="939.6" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">на других узлах пока нет.</text>
<text x="80" y="218.0" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">ДАННЫЕ РАСПРЕДЕЛЕНЫ МЕЖДУ ШАРДАМИ</text>
<text x="80" y="243.2" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">shard1RS и shard2RS хранят разные части коллекции.</text>
<text x="80" y="268.4" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">configRS хранит карту распределения данных.</text>
<text x="80" y="293.6" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">Все три replica set пока состоят из одного узла.</text>
<text x="80" y="318.8" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">Резервирование появится на следующем этапе.</text>
<text x="80" y="666.0" font-size="16" fill="#425466" font-weight="normal" text-anchor="start">Один инстанс приложения; доступ через порт 8080.</text>
<text x="80" y="688.4" font-size="16" fill="#425466" font-weight="normal" text-anchor="start">MongoDB: mongodb://mongos:27017</text>
<text x="80" y="823.0" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">СЛЕДУЮЩИЙ ЭТАП</text>
<text x="80" y="848.2" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">Добавить по два secondary в каждый replica set.</text>
<text x="80" y="873.4" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">Сохранить два шарда и маршрутизацию через mongos.</text>
<text x="60" y="1087.0" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">Синий — запросы данных; оранжевый — метаданные; фиолетовый — репликация и heartbeat (HB).</text>
<text x="60" y="1126.0" font-size="16" fill="#425466" font-weight="normal" text-anchor="start">Серый пунктир — обнаружение и мониторинг secondary со стороны mongos; ответы идут по тем же соединениям.</text>
<text x="60" y="1166.0" font-size="16" fill="#425466" font-weight="normal" text-anchor="start">Показаны основные связи сервисов. Служебные обращения шардов к configRS и миграции чанков описаны в README.</text>
</g></svg>
