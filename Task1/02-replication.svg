<text x="435" y="566" font-size="13" fill="#245D91" font-weight="normal" text-anchor="middle">MongoDB protocol</text>
<text x="80" y="218.0" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">ТРИ НЕЗАВИСИМЫЕ ГРУППЫ РЕПЛИКАЦИИ</text>
<text x="80" y="243.2" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">В каждой группе: 1 primary + 2 secondary.</text>
<text x="80" y="268.4" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">Всего 6 узлов данных и 3 узла метаданных.</text>
<text x="80" y="293.6" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">Внутри шарда копируется один и тот же набор данных.</text>
<text x="80" y="318.8" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">Роли primary / secondary меняются после выборов.</text>
<text x="80" y="666.0" font-size="16" fill="#425466" font-weight="normal" text-anchor="start">Один инстанс приложения; доступ через порт 8080.</text>
<text x="80" y="688.4" font-size="16" fill="#425466" font-weight="normal" text-anchor="start">MongoDB: mongodb://mongos:27017</text>
<text x="80" y="823.0" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">СЛЕДУЮЩИЙ ЭТАП</text>
<text x="80" y="848.2" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">Добавить Redis для кеширования чтений приложения.</text>
<text x="80" y="873.4" font-size="18" fill="#425466" font-weight="normal" text-anchor="start">Сохранить два шарда и маршрутизацию через mongos.</text>
<text x="60" y="1087.0" font-size="17" fill="#425466" font-weight="normal" text-anchor="start">Синий — запросы данных; оранжевый — метаданные; фиолетовый — репликация и heartbeat (HB).</text>
<text x="60" y="1126.0" font-size="16" fill="#425466" font-weight="normal" text-anchor="start">Серый пунктир — обнаружение и мониторинг secondary со стороны mongos; ответы идут по тем же соединениям.</text>
<text x="60" y="1166.0" font-size="16" fill="#425466" font-weight="normal" text-anchor="start">Показаны основные связи сервисов. Служебные обращения шардов к configRS и миграции чанков описаны в README.</text>
</g></svg>
