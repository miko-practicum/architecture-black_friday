name: mongo-sharding

x-mongo: &mongo
  image: mongo:7.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "mongosh --port $$MONGO_PORT --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'"]
    interval: 15s
    timeout: 10s
    retries: 8
    start_period: 20s

services:
  configSrv-1:
    <<: *mongo
    command: ["mongod", "--configsvr", "--replSet", "configRS", "--port", "27019", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_PORT: "27019"
      REPLICA_SET: configRS
      MEMBER_HOST: configSrv-1:27019
      CONFIG_SERVER: "true"
    volumes:
      - config_data:/data/configdb
      - ./scripts:/scripts:ro

  shard1-1:
    <<: *mongo
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27018", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_PORT: "27018"
      REPLICA_SET: shard1RS
      MEMBER_HOST: shard1-1:27018
    volumes:
      - shard1_data:/data/db
      - ./scripts:/scripts:ro

  shard2-1:
    <<: *mongo
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27018", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_PORT: "27018"
      REPLICA_SET: shard2RS
      MEMBER_HOST: shard2-1:27018
    volumes:
      - shard2_data:/data/db
      - ./scripts:/scripts:ro

  mongos:
    <<: *mongo
    command: ["mongos", "--configdb", "configRS/configSrv-1:27019", "--port", "27017", "--bind_ip_all"]
    environment:
      MONGO_PORT: "27017"
    depends_on:
      configSrv-1:
        condition: service_healthy
      shard1-1:
        condition: service_healthy
      shard2-1:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro

  pymongo-api:
    image: kazhem/pymongo_api:1.0.0
    platform: linux/amd64
    volumes:
      # The published image supplies the runtime; project changes are mounted read-only.
      - ./api_app/app.py:/app/app.py:ro
    restart: unless-stopped
    depends_on:
      mongos:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      MONGODB_URL: mongodb://mongos:27017
      MONGODB_DATABASE_NAME: somedb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  config_data:
  shard1_data:
  shard2_data:
